<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Blog</title></head>
<body>
<form id="search" action="/search" role="search">
  <input type="search" name="password" placeholder="Rechercher un mot de passe oublié…">
  <button>OK</button>
</form>
<form id="comment" action="/comment" method="post">
  <input type="text" id="password" name="pwd_hint" placeholder="Indice">
  <textarea name="body"></textarea>
  <button>Envoyer</button>
</form>
<form id="otp" action="/otp" method="post">
  <input type="password" autocomplete="one-time-code" inputmode="numeric" name="code" placeholder="Code reçu par SMS">
  <button>Vérifier</button>
</form>
</body></html>
