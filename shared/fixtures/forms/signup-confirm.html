<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Inscription</title></head>
<body>
<form id="register" action="/register" method="post">
  <input id="first" name="first_name" type="text" placeholder="Prénom">
  <input id="email" name="email" type="email" autocomplete="email" placeholder="Adresse e-mail">
  <input id="pw1" name="password" type="password" autocomplete="new-password" placeholder="Mot de passe">
  <input id="pw2" name="password_confirmation" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe">
  <button>Créer mon compte</button>
</form>
</body></html>
