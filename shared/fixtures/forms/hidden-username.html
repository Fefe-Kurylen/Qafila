<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Connexion</title>
<style>.step-done { display: none; }</style></head>
<body>
<form id="login" action="/account/login" method="post">
  <div class="step-done"><input id="email" type="email" name="email" value="lina@example.org" autocomplete="username"></div>
  <p>Connecté en tant que <b>lina@example.org</b> · <a href="#">Changer</a></p>
  <input id="password" type="password" name="password" autocomplete="current-password">
  <button type="submit">Connexion</button>
</form>
</body></html>
