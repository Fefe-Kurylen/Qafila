# Projet Xcode généré avec XcodeGen : `brew install xcodegen && xcodegen generate` puis ouvrir QafilaBrowser.xcodeproj
name: QafilaBrowser
options:
  developmentLanguage: fr
  bundleIdPrefix: fr.qafila
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(QAFILA_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark AppIcon-Ink AppIcon-Desert AppIcon-Gold"
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Canal « Soutenir Qafila » : store = abonnement App Store (par défaut : App Store, TestFlight, Xcode) ;
    # stripe = lien de paiement Stripe de shared/support.json (IPA de test hors App Store, cf. .github/workflows/ios.yml).
    # Passer à stripe pour l'App Store seulement après inscription aux conditions de lien externe d'Apple.
    QAFILA_SUPPORT_CHANNEL: store
targets:
  QafilaBrowser:
    type: application
    platform: iOS
    # Abonnement « Soutenir Qafila » simulé quand l'appli est lancée depuis Xcode (sans compte App Store Connect).
    scheme:
      storeKitConfiguration: Qafila.storekit
    sources:
      - path: QafilaBrowser
      # Lien de soutien partagé par toutes les plateformes (lu au lancement, jamais recopié dans le code).
      - path: ../shared/support.json
        buildPhase: resources
    info:
      path: QafilaBrowser/Info.plist
      properties:
        CFBundleDisplayName: Qafila
        CFBundleName: Qafila
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [http, https]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [http, https]
            CFBundleURLName: fr.qafila.browser
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [fr, en, ar, es, de]
        CFBundleDevelopmentRegion: fr
        LSApplicationCategoryType: public.app-category.utilities
        QafilaSupportChannel: $(QAFILA_SUPPORT_CHANNEL)
