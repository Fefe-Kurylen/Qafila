# Qafila Browser : captures d'écran pour l'App Store (iPhone 6,9") et Google Play (téléphone 9:16).
# Lance chaque appli en « mode démo » (onglets pré-remplis, menu / onglets / éditeur / réglages ouverts)
# et dépose les images en artefacts : store-screenshots-ios et store-screenshots-android.
name: Qafila captures stores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/screenshots.yml", "ios-browser/QafilaBrowser/**", "android-browser/app/src/**", "android-browser/play/capture-screenshots.sh"]

concurrency:
  group: qafila-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Captures iPhone
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-browser
    steps:
      - uses: actions/checkout@v4
      - name: "Choisir le Xcode le plus récent (SDK iOS 26, Liquid Glass)"
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
