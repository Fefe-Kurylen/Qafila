# Qafila Browser iOS : compilation de vérification à chaque push, TestFlight / App Store à la demande.
name: Qafila iOS

on:
  push:
    branches: [main]
    paths: ["ios-browser/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios-browser/**"]
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane fastlane à exécuter"
        type: choice
        options: [build, beta, release]
        default: build

permissions:
  contents: write

concurrency:
  group: qafila-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler (${{ github.event.inputs.lane || 'build' }})
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-browser
    steps:
      - uses: actions/checkout@v4
      - name: "Choisir le Xcode le plus récent (SDK iOS 26, Liquid Glass)"
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
