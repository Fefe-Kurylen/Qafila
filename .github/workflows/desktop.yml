# Qafila pour PC (Electron) : installateur Windows (.exe), AppImage Linux, DMG macOS (non signé tant que le compte Apple n'est pas relié).
# - Poussée sur main : les fichiers vont dans la release « Version de test » (prerelease), à côté de l'APK et de l'IPA.
# - Étiquette « vX.Y.Z » (même numéro que desktop/package.json) : release publique « Qafila X.Y.Z » avec les fichiers de
#   mise à jour (latest.yml, latest-linux.yml, latest-mac.yml, .blockmap). Les Qafila déjà installés la détectent
#   (main/updater.js) et affichent le bouton « Mettre à jour ».
name: Qafila PC

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qafila-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Préparer la release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le numéro de version
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "L'étiquette ${GITHUB_REF_NAME} ne correspond pas à desktop/package.json ($v)"; exit 1; fi
      - name: Créer la release publique
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Qafila ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true

  build:
    name: ${{ matrix.label }}
    needs: [release]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: dist:win
            glob: desktop/dist/*.exe
            update: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          - os: ubuntu-latest
            label: Linux
            script: dist:linux
            glob: desktop/dist/*.AppImage
            update: |
              desktop/dist/*.AppImage
              desktop/dist/latest-linux.yml
          - os: macos-15
            label: macOS
            script: dist:mac
            glob: desktop/dist/*.dmg
            update: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/*.blockmap
              desktop/dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dépendances
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        run: npm ci
      - name: Tests
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        run: npm test
      - name: Numéroter la version de test (X.Y.Z-test.N, mise à jour automatique des versions de test)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('desktop/package-lock.json') != '' }}
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          npm version --no-git-tag-version --allow-same-version "$v-test.${{ github.run_number }}"
          node -p "'Version de test : ' + require('./package.json').version"
      # Mac signé et vérifié par Apple (Developer ID + notarisation) quand les secrets sont présents ; sinon .dmg de test
      # non signé. Notarisation avec la clé API App Store Connect (mêmes secrets que l'iPhone).
      - name: Préparer la signature Apple (Mac)
        if: ${{ runner.os == 'macOS' && hashFiles('desktop/package-lock.json') != '' }}
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          echo "MAC_CERTIFICATE_P12_BASE64 : $([ -n "$P12" ] && echo true || echo false)"
          echo "MAC_CERTIFICATE_PASSWORD : $([ -n "$P12_PASSWORD" ] && echo true || echo false)"
          if [ -z "$P12" ]; then echo "Pas de certificat Developer ID : .dmg de test non signé."; exit 0; fi
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          { echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12"; echo "CSC_KEY_PASSWORD=$P12_PASSWORD"; } >> "$GITHUB_ENV"
          node -e "const f='package.json',p=require('./'+f),m=p.build.mac;delete m.identity;m.hardenedRuntime=true;m.gatekeeperAssess=false;m.entitlements=m.entitlementsInherit='build/entitlements.mac.plist';m.notarize=!!process.env.ASC_KEY;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          if [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER" ]; then
            printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY_ID=$ASC_KEY_ID"; echo "APPLE_API_ISSUER=$ASC_ISSUER"; } >> "$GITHUB_ENV"
            echo "Signature Developer ID + notarisation Apple."
          else
            echo "Signature Developer ID sans notarisation (clé App Store Connect absente)."
          fi
      - name: Empaqueter
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Lister
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        shell: bash
        run: ls -la dist | grep -Ei "exe|appimage|dmg|zip|yml|blockmap" || ls -la dist
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('desktop/package-lock.json') != '' }}
        with:
          name: qafila-pc-${{ matrix.label }}
          path: ${{ matrix.update }}
      - name: Retirer les anciennes versions de la release de test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('desktop/package-lock.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +o pipefail
          v=$(node -p "require('./package.json').version")
          gh release view test --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^Qafila-[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?-(win\.exe|win\.exe\.blockmap|linux\.AppImage|mac-[a-z0-9]+\.(dmg|zip|dmg\.blockmap|zip\.blockmap))$' \
            | grep -v "^Qafila-$v-" \
            | while read -r n; do gh release delete-asset test "$n" --repo "$GITHUB_REPOSITORY" -y || true; done || true
      - name: Publier dans la release de test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('desktop/package-lock.json') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Version de test
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ matrix.update }}
      - name: Publier la version (mise à jour automatique)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && hashFiles('desktop/package-lock.json') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: ${{ matrix.update }}

  # Paquet Microsoft Store (MSIX/.appx), numéro de version propre (X.Y.Z → X.Y.Z.0, exigé par le Store) :
  # le Store le signe lui-même. Déposé dans la release de test (poussée sur main) ou dans la release « vX.Y.Z ».
  store:
    name: Microsoft Store
    needs: [release]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Paquet Microsoft Store
        shell: pwsh
        run: |
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "Kit Windows : $($kit.DirectoryName)"
          $env:ELECTRON_BUILDER_WINDOWS_KITS_PATH = $kit.DirectoryName
          npm run dist:store -- --publish never
          Get-ChildItem dist/*.appx | Format-Table Name, Length
      - name: Vérifier le manifeste du paquet
        shell: pwsh
        run: |
          $appx = Get-ChildItem dist/*.appx | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
          $xml = [xml](New-Object System.IO.StreamReader($entry.Open())).ReadToEnd()
          $zip.Dispose()
          $id = $xml.Package.Identity
          Write-Host "Identité : $($id.Name) · $($id.Publisher) · $($id.Version)"
          if ($id.Version -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Version Store invalide : $($id.Version)" }
      - uses: actions/upload-artifact@v4
        with:
          name: qafila-microsoft-store
          path: desktop/dist/*.appx
      - name: Publier dans la release de test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Version de test
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: desktop/dist/*.appx
      - name: Publier avec la version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: desktop/dist/*.appx
