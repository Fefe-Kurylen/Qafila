# Qafila Browser Android : compilation + tests à chaque push, bundle signé et envoi Google Play à la demande.
name: Qafila Android

on:
  push:
    branches: [main]
    paths: ["android-browser/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-browser/**"]
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Google Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: write

concurrency:
  group: qafila-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: SDK Android (préinstallé sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Compilation debug + lint
        run: gradle assembleDebug lintDebug --no-daemon --console=plain

      - name: Conserver l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: qafila-debug-apk
          path: android-browser/app/build/outputs/apk/debug/app-debug.apk

      - name: Nommer l'APK de test
        if: ${{ github.event_name == 'push' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Qafila-Android-test.apk

      # Release « test » toujours à jour : téléchargeable directement depuis le téléphone (onglet Releases du dépôt).
      - name: Publier dans la release de test
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Version de test
          prerelease: true
          make_latest: false
          body: |
            Version de test de Qafila, refaite automatiquement à chaque modification.
            
            **Android** : ouvrir Qafila-Android-test.apk sur le téléphone et installer.
            **iPhone** : installer Qafila-iPhone-test.ipa avec Sideloadly (identifiant Apple gratuit). Voir TESTER.md.
          files: android-browser/Qafila-Android-test.apk

  release:
    name: Publier sur Google Play (${{ github.event.inputs.track }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: SDK Android (préinstallé sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Restaurer le keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/qafila.jks

      - name: Bundle release signé
        run: gradle bundleRelease --no-daemon --console=plain
        env:
          KEYSTORE_FILE: /tmp/qafila.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

      - name: Envoyer sur Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.qafila.browser
          releaseFiles: android-browser/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: android-browser/play/whatsnew
          mappingFile: android-browser/app/build/outputs/mapping/release/mapping.txt

      - name: Conserver le bundle
        uses: actions/upload-artifact@v4
        with:
          name: qafila-release-aab
          path: android-browser/app/build/outputs/bundle/release/app-release.aab
